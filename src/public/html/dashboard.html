<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD | Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Style. -->
    <link rel="stylesheet" href="/public/style/commonStyles.css">
    <link rel="stylesheet" href="/public/style/dashboard.css">
</head>

<body>
    <main class="dashboard-page">

        <!-- Main numbers. -->
        <section class="dashboard-cards">

            <article class="dashboard-card dashboard-card-balance">
                <span class="dashboard-card-icon"><i class="fa-solid fa-wallet"></i></span>
                <div class="dashboard-card-body">
                    <span class="dashboard-card-label">Account amount</span>
                    <b class="dashboard-card-value" id="dashboard-balance">--</b>
                </div>
            </article>

            <article class="dashboard-card">
                <span class="dashboard-card-icon dashboard-icon-total"><i class="fa-solid fa-list-check"></i></span>
                <div class="dashboard-card-body">
                    <span class="dashboard-card-label">Total trades</span>
                    <b class="dashboard-card-value" id="dashboard-total">0</b>
                    <span class="dashboard-card-note" id="dashboard-rate">Win rate 0%</span>
                </div>
            </article>

            <article class="dashboard-card">
                <span class="dashboard-card-icon dashboard-icon-profit"><i class="fa-solid fa-arrow-trend-up"></i></span>
                <div class="dashboard-card-body">
                    <span class="dashboard-card-label">Profit trades</span>
                    <b class="dashboard-card-value dashboard-profit" id="dashboard-wins">0</b>
                    <span class="dashboard-card-note" id="dashboard-gross-profit">Gross +0.00</span>
                </div>
            </article>

            <article class="dashboard-card">
                <span class="dashboard-card-icon dashboard-icon-loss"><i class="fa-solid fa-arrow-trend-down"></i></span>
                <div class="dashboard-card-body">
                    <span class="dashboard-card-label">Loss trades</span>
                    <b class="dashboard-card-value dashboard-loss" id="dashboard-losses">0</b>
                    <span class="dashboard-card-note" id="dashboard-gross-loss">Gross 0.00</span>
                </div>
            </article>

        </section>

        <!-- Equity graph. -->
        <section class="dashboard-chart-card">
            <header class="dashboard-chart-head">
                <div>
                    <h2>Equity</h2>
                </div>
                <div class="dashboard-chart-numbers">
                    <span>Equity <b id="dashboard-equity">--</b></span>
                    <span>Net P&amp;L <b id="dashboard-net">0.00</b></span>
                </div>
            </header>

            <div class="dashboard-chart-wrap">
                <div class="dashboard-chart" id="dashboard-chart"></div>
                <div class="dashboard-chart-empty" id="dashboard-chart-empty">
                    <i class="fa-solid fa-chart-line"></i>
                    <p>The graph appears after the first closed trade and the first account update from MT5.</p>
                </div>
            </div>
        </section>

    </main>

    <script src="/public/js/vendor/lightweight-charts.js"></script> <!-- Chart library (local copy). -->
    <script src="/public/js/toaster.js"></script>
    <script src="/public/js/dashboard.js"></script>
</body>

</html>
